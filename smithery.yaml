# Smithery configuration for CARF (Recursos Fiscais)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_carf

name: carf-mcp
displayName: "CARF (Recursos Fiscais)"
description: >
  Duas consultas ao **CARF** numa conexão só: busque acórdãos e súmulas por termo ou tese, de graça, e consulte os processos de um CPF ou CNPJ no conselho quando precisar. A busca de acórdãos alcança ainda outros 16 tribunais brasileiros, do STF aos tribunais de justiça estaduais. Hospedado pela plataforma, sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/carf-mcp
repository: https://github.com/mcp-dir/carf-mcp

tags:
  - carf
  - tributario
  - tax
  - brazil
  - acordaos
  - jurisprudencia
  - contencioso-fiscal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_carf

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_carf/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
